# Example only: replace the domain and configure your TLS certificate.
# CRITICAL: every URL goes through Python. No alias/root/try_files/static CDN
# may expose public/academy directly, including data and offline scripts.
server {
    listen 443 ssl;
    server_name academy.example.org;
    ssl_certificate /etc/letsencrypt/live/academy.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.example.org/privkey.pem;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host academy.example.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_cache off;
    }
}
