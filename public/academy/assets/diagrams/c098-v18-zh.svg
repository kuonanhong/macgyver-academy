<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img">
<title>飛機退役拆解與再利用</title>
<rect width="100%" height="100%" fill="#0c263c"/>
<text x="45" y="43" font-size="24" fill="#ffffff" font-family="sans-serif">飛機退役拆解與再利用</text>
<rect x="65" y="110" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="140" font-size="18" fill="#14334a" font-family="sans-serif">01 · 退役構型與部件身份</text>
<path d="M500 185v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="210" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="240" font-size="18" fill="#14334a" font-family="sans-serif">02 · 目標材料回收率</text>
<path d="M500 285v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="310" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="340" font-size="18" fill="#14334a" font-family="sans-serif">03 · 材料鑑別取樣</text>
<path d="M500 385v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="410" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="440" font-size="18" fill="#14334a" font-family="sans-serif">04 · 搬移前的假想質量分布</text>
<path d="M500 485v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="510" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="540" font-size="18" fill="#14334a" font-family="sans-serif">05 · 錯誤身份與污染的流程失效</text>
<path d="M500 585v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="610" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="640" font-size="18" fill="#14334a" font-family="sans-serif">06 · 部件再利用及材料回收分流交接</text>
<text x="65" y="786" fill="#ffbd5c" font-size="17" font-family="sans-serif">原創教學關係圖 · 非飛機設計圖或現場竣工圖</text></svg>