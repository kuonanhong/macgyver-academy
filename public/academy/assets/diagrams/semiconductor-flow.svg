<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">半導體：從晶圓到可測試電路 / Semiconductor integration</title><desc id="desc">原創概念流程 · 分支與重複層省略 · 課程編號是學習順序，不是量產配方</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#6d8475"/></marker></defs><rect width="1000" height="700" rx="20" fill="#f3f5ee"/><text x="40" y="50" fill="#193d31" font-size="25" font-family="sans-serif">半導體：從晶圓到可測試電路 / Semiconductor integration</text><text x="40" y="80" fill="#536a5b" font-size="15" font-family="sans-serif">原創概念流程 · 分支與重複層省略 · 課程編號是學習順序，不是量產配方</text><path d="M300 169L370 169" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M620 169L690 169" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M815 208L815 280" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M690 319L620 319" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M370 319L300 319" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M300 479L370 479" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M620 479L690 479" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="130" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="65" y="160" fill="#193d31" font-size="18" font-family="sans-serif">規格與製程整合</text><text x="65" y="185" fill="#536a5b" font-size="13" font-family="sans-serif">Requirements &amp; process integration</text><rect x="370" y="130" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="385" y="160" fill="#193d31" font-size="18" font-family="sans-serif">晶圓與表面準備</text><text x="385" y="185" fill="#536a5b" font-size="13" font-family="sans-serif">Wafer &amp; surface preparation</text><rect x="690" y="130" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="705" y="160" fill="#193d31" font-size="18" font-family="sans-serif">前段元件 FEOL</text><text x="705" y="185" fill="#536a5b" font-size="13" font-family="sans-serif">Isolation, wells, gate, source/drain</text><rect x="690" y="280" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="705" y="310" fill="#193d31" font-size="18" font-family="sans-serif">接觸與互連 MOL / BEOL</text><text x="705" y="335" fill="#536a5b" font-size="13" font-family="sans-serif">Contacts, dielectric, vias &amp; wiring</text><rect x="370" y="280" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="385" y="310" fill="#193d31" font-size="18" font-family="sans-serif">鈍化與晶圓測試</text><text x="385" y="335" fill="#536a5b" font-size="13" font-family="sans-serif">Passivation &amp; wafer electrical test</text><rect x="50" y="280" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="65" y="310" fill="#193d31" font-size="18" font-family="sans-serif">封裝交接與追溯</text><text x="65" y="335" fill="#536a5b" font-size="13" font-family="sans-serif">Packaging handoff &amp; traceability</text><rect x="50" y="440" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="65" y="470" fill="#193d31" font-size="18" font-family="sans-serif">微影回圈</text><text x="65" y="495" fill="#536a5b" font-size="13" font-family="sans-serif">Coat → expose → develop</text><rect x="370" y="440" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="385" y="470" fill="#193d31" font-size="18" font-family="sans-serif">圖形轉移與材料改質</text><text x="385" y="495" fill="#536a5b" font-size="13" font-family="sans-serif">Etch / implant / deposition</text><rect x="690" y="440" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="705" y="470" fill="#193d31" font-size="18" font-family="sans-serif">量測、回饋與製程修正</text><text x="705" y="495" fill="#536a5b" font-size="13" font-family="sans-serif">Measure, inspect &amp; process feedback</text><text x="40" y="592" fill="#536a5b" font-size="14" font-family="sans-serif">上方：主要整合階段。下方：多次使用的單元製程與量測回圈；各材料層採用不同組合。</text><text x="40" y="619" fill="#536a5b" font-size="14" font-family="sans-serif">Top: integration phases. Bottom: recurring unit-process modules; sequence depends on layer and technology.</text><text x="40" y="646" fill="#536a5b" font-size="14" font-family="sans-serif">FinFET、GAA、背面供電為不同整合路線。圖中位置、尺度與箭頭不代表設備布局或配方參數。</text></svg>