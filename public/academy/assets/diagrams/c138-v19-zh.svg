<text x="85" y="540" font-size="18" fill="#14334a" font-family="sans-serif">05 · 以區間報告熱侵入不確定度</text>
<text x="65" y="686" fill="#ffbd5c" font-size="17" font-family="sans-serif">原創教學關係圖 · 非船舶設計圖或現場竣工圖</text></svg>