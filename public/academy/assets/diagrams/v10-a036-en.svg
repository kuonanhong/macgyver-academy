<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Photomask defect inspection and repair — evidence map</title><desc id="desc">Original conceptual learning map. Not a manufacturer drawing or to scale.</desc><rect width="1200" height="800" fill="#f6f8fb"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#168478"/></marker></defs><text x="46" y="45" font-family="system-ui,sans-serif" font-size="16" fill="#168478">ENGINEERING EVIDENCE / A036</text><text x="46" y="85" font-family="system-ui,sans-serif" font-size="25" fill="#14243b">Photomask defect inspection and repair</text><rect x="40" y="200" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="62" y="230" font-family="system-ui,sans-serif" font-size="16" fill="#168478">01  MODEL</text><text x="62" y="267" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Separate clear, opaque and</text><text x="62" y="294" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">phase defects</text><rect x="810" y="200" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="832" y="230" font-family="system-ui,sans-serif" font-size="16" fill="#168478">02  OBSERVE</text><text x="832" y="267" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Transform inspection</text><text x="832" y="294" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">coordinates into repair</text><text x="832" y="321" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">coordinates</text><rect x="40" y="510" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="62" y="540" font-family="system-ui,sans-serif" font-size="16" fill="#168478">03  DISCRIMINATE</text><text x="62" y="577" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Plan local removal for</text><text x="62" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">excess opaque material</text><rect x="810" y="510" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="832" y="540" font-family="system-ui,sans-serif" font-size="16" fill="#168478">04  ACCEPT / HOLD</text><text x="832" y="577" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Complete a traceable</text><text x="832" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">defect-closure report</text><path d="M390 277 L488 323" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 277 L712 323" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390 587 L488 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 587 L712 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 400 L560 400 L560 345 L630 345 L630 410 L695 410" fill="none" stroke="#2065aa" stroke-width="11"/><path d="M510 420 L580 420 L580 366 L650 366 L650 434 L695 434" fill="none" stroke="#bf8c29" stroke-width="4" stroke-dasharray="7 5"/><text x="440" y="165" font-family="system-ui,sans-serif" font-size="18" fill="#168478">RELATIONS TO VERIFY</text><text x="430" y="600" font-family="system-ui,sans-serif" font-size="16" fill="#14243b">Concept symbol only</text><text x="46" y="710" font-family="system-ui,sans-serif" font-size="18" fill="#14243b">Observe → compare → record uncertainty → justify a decision</text><text x="46" y="751" font-family="system-ui,sans-serif" font-size="15" fill="#5c687a">Original academy learning map · not a process recipe or manufacturer drawing · not to scale</text></svg>