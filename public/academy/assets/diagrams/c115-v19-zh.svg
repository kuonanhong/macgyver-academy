<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img">
<title>RV Falkor too 科學研究船</title>
<rect width="100%" height="100%" fill="#0c263c"/>
<text x="45" y="43" font-size="24" fill="#ffffff" font-family="sans-serif">RV Falkor too 科學研究船</text>
<rect x="65" y="110" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="140" font-size="18" fill="#14334a" font-family="sans-serif">01 · 區分改裝科研設備與船體質量</text>
<path d="M500 185v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="210" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="240" font-size="18" fill="#14334a" font-family="sans-serif">02 · 畫出優先調查區與掃幅重疊</text>
<path d="M500 285v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="310" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="340" font-size="18" fill="#14334a" font-family="sans-serif">03 · 核對影像與海床點的時間配對</text>
<path d="M500 385v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="410" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="440" font-size="18" fill="#14334a" font-family="sans-serif">04 · 保留原始點雲與處理版本</text>
<path d="M500 485v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
<rect x="65" y="510" width="865" height="72" rx="12" fill="#dceef2"/>
<text x="85" y="540" font-size="18" fill="#14334a" font-family="sans-serif">05 · 對比定位和影像尺度誤差</text>
<text x="65" y="686" fill="#ffbd5c" font-size="17" font-family="sans-serif">原創教學關係圖 · 非船舶設計圖或現場竣工圖</text></svg>