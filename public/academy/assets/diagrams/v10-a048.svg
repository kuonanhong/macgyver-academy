oke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390 587 L488 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 587 L712 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 400 L560 400 L560 345 L630 345 L630 410 L695 410" fill="none" stroke="#2065aa" stroke-width="11"/><path d="M510 420 L580 420 L580 366 L650 366 L650 434 L695 434" fill="none" stroke="#bf8c29" stroke-width="4" stroke-dasharray="7 5"/><text x="440" y="165" font-family="system-ui,sans-serif" font-size="18" fill="#168478">待驗證的關係</text><text x="430" y="600" font-family="system-ui,sans-serif" font-size="16" fill="#14243b">中央圖示僅表達概念</text><text x="46" y="710" font-family="system-ui,sans-serif" font-size="18" fill="#14243b">觀察 → 比較 → 記錄不確定度 → 提出可審查判斷</text><text x="46" y="751" font-family="system-ui,sans-serif" font-size="15" fill="#5c687a">學院原創學習架構圖 · 非量產流程／廠商圖面 · 非比例圖</text></svg>