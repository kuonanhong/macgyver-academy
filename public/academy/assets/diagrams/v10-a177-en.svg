ntion: model and</text><text x="62" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">design</text><rect x="810" y="510" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="832" y="540" font-family="system-ui,sans-serif" font-size="16" fill="#168478">04  ACCEPT / HOLD</text><text x="832" y="577" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Task-level acceptance:</text><text x="832" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">measurement and diagnosis</text><path d="M390 277 L488 323" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 277 L712 323" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390 587 L488 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 587 L712 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M475 383 H545 C570 300 630 300 655 383 H725 M545 383 C570 465 630 465 655 383" fill="none" stroke="#2065aa" stroke-width="8"/><circle cx="600" cy="383" r="44" fill="none" stroke="#168478" stroke-width="6"/><text x="440" y="165" font-family="system-ui,sans-serif" font-size="18" fill="#168478">RELATIONS TO VERIFY</text><text x="430" y="600" font-family="system-ui,sans-serif" font-size="16" fill="#14243b">Concept symbol only</text><text x="46" y="710" font-family="system-ui,sans-serif" font-size="18" fill="#14243b">Observe → compare → record uncertainty → justify a decision</text><text x="46" y="751" font-family="system-ui,sans-serif" font-size="15" fill="#5c687a">Original academy learning map · not a process recipe or manufacturer drawing · not to scale</text></svg>