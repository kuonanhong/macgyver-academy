<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">先進封裝：依產品選路線 / Advanced packaging routes</title><desc id="desc">原創架構圖 · 替代路線可組合，但不會全部串成同一條製造流程</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#6d8475"/></marker></defs><rect width="1000" height="700" rx="20" fill="#f3f5ee"/><text x="40" y="50" fill="#193d31" font-size="25" font-family="sans-serif">先進封裝：依產品選路線 / Advanced packaging routes</text><text x="40" y="80" fill="#536a5b" font-size="15" font-family="sans-serif">原創架構圖 · 替代路線可組合，但不會全部串成同一條製造流程</text><path d="M495 198L175 270" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M495 198L495 270" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M495 198L815 270" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M175 348L175 440" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M495 348L495 440" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M815 348L815 440" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M300 479L370 479" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M620 479L690 479" stroke="#6d8475" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="120" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="385" y="150" fill="#193d31" font-size="18" font-family="sans-serif">封裝規格與已知良品晶粒</text><text x="385" y="175" fill="#536a5b" font-size="13" font-family="sans-serif">Package requirements &amp; known-good die</text><rect x="50" y="270" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="65" y="300" fill="#193d31" font-size="18" font-family="sans-serif">打線封裝</text><text x="65" y="325" fill="#536a5b" font-size="13" font-family="sans-serif">Die attach → wire bonding</text><rect x="370" y="270" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="385" y="300" fill="#193d31" font-size="18" font-family="sans-serif">倒裝與扇出</text><text x="385" y="325" fill="#536a5b" font-size="13" font-family="sans-serif">Bumping / reconstitution / RDL</text><rect x="690" y="270" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="705" y="300" fill="#193d31" font-size="18" font-family="sans-serif">2.5D / 3D 整合</text><text x="705" y="325" fill="#536a5b" font-size="13" font-family="sans-serif">Interposer / TSV / hybrid bonding</text><rect x="50" y="440" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="65" y="470" fill="#193d31" font-size="18" font-family="sans-serif">材料與機械結構</text><text x="65" y="495" fill="#536a5b" font-size="13" font-family="sans-serif">Molding, substrate &amp; warpage</text><rect x="370" y="440" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="385" y="470" fill="#193d31" font-size="18" font-family="sans-serif">互連與散熱組裝</text><text x="385" y="495" fill="#536a5b" font-size="13" font-family="sans-serif">Interconnects &amp; thermal assembly</text><rect x="690" y="440" width="250" height="78" rx="10" fill="white" stroke="#bbcab7"/><text x="705" y="470" fill="#193d31" font-size="18" font-family="sans-serif">電測、可靠度與失效分析</text><text x="705" y="495" fill="#536a5b" font-size="13" font-family="sans-serif">Electrical test, reliability &amp; FA</text><text x="40" y="592" fill="#536a5b" font-size="14" font-family="sans-serif">課程模組便於逐步學習；實際流程需依晶粒、材料、互連與熱機械需求另外整合。</text><text x="40" y="619" fill="#536a5b" font-size="14" font-family="sans-serif">A curriculum order is not a manufacturing traveler. Each route needs its own qualified integration flow.</text><text x="40" y="646" fill="#536a5b" font-size="14" font-family="sans-serif">HBM / Chiplet 是系統與產品整合情境；CPO 另有光學耦合及熱管理需求。</text></svg>