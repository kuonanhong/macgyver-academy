<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Ultrapure-water supply systems — evidence map</title><desc id="desc">Original conceptual learning map. Not a manufacturer drawing or to scale.</desc><rect width="1200" height="800" fill="#f6f8fb"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#168478"/></marker></defs><text x="46" y="45" font-family="system-ui,sans-serif" font-size="16" fill="#168478">ENGINEERING EVIDENCE / A008</text><text x="46" y="85" font-family="system-ui,sans-serif" font-size="25" fill="#14243b">Ultrapure-water supply systems</text><rect x="40" y="200" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="62" y="230" font-family="system-ui,sans-serif" font-size="16" fill="#168478">01  MODEL</text><text x="62" y="267" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Define points of use</text><rect x="810" y="200" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="832" y="230" font-family="system-ui,sans-serif" font-size="16" fill="#168478">02  OBSERVE</text><text x="832" y="267" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Assign pretreatment</text><text x="832" y="294" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">functions</text><rect x="40" y="510" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="62" y="540" font-family="system-ui,sans-serif" font-size="16" fill="#168478">03  DISCRIMINATE</text><text x="62" y="577" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Trace the recirculation</text><text x="62" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">loop</text><rect x="810" y="510" width="350" height="155" rx="16" fill="white" stroke="#ced9e6" stroke-width="2"/><text x="832" y="540" font-family="system-ui,sans-serif" font-size="16" fill="#168478">04  ACCEPT / HOLD</text><text x="832" y="577" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">Assemble water-system</text><text x="832" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#14243b">acceptance</text><path d="M390 277 L488 323" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 277 L712 323" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M390 587 L488 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 587 L712 447" stroke="#168478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="490" y="304" width="220" height="163" rx="16" fill="white" stroke="#2065aa" stroke-width="4"/><rect x="520" y="330" width="42" height="50" rx="5" fill="#168478"/><rect x="582" y="330" width="42" height="50" rx="5" fill="#168478"/><rect x="644" y="330" width="42" height="50" rx="5" fill="#168478"/><path d="M513 422 H691" stroke="#bf8c29" stroke-width="10"/><text x="440" y="165" font-family="system-ui,sans-serif" font-size="18" fill="#168478">RELATIONS TO VERIFY</text><text x="430" y="600" font-family="system-ui,sans-serif" font-size="16" fill="#14243b">Concept symbol only</text><text x="46" y="710" font-family="system-ui,sans-serif" font-size="18" fill="#14243b">Observe → compare → record uncertainty → justify a decision</text><text x="46" y="751" font-family="system-ui,sans-serif" font-size="15" fill="#5c687a">Original academy learning map · not a process recipe or manufacturer drawing · not to scale</text></svg>