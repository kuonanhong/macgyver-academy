<text x="85" y="540" font-size="18" fill="#14334a" font-family="sans-serif">05 · 警示可信度與漏報</text>
<path d="M500 585v22m-8-8l8 8 8-8" stroke="#ffbd5c" fill="none" stroke-width="3"/>
