<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1727">
  <title>太空任務試算室 · MacGyver V23</title>
  <link rel="stylesheet" href="space-lab-v23.css">
</head>
<body>
  <header class="lab-header">
    <div class="lab-shell header-content">
      <a id="academy-link" href="index.html" class="academy"><span aria-hidden="true">◆</span> MacGyver <small>V23</small></a>
      <div class="header-actions">
        <a id="world-link" href="experience.html?domain=space">返回太空工程場景</a>
        <label for="lab-language" class="visually-hidden">語言 / Language</label>
        <select id="lab-language" data-no-translate><option value="zh-TW">繁體中文</option><option value="en">English</option></select>
      </div>
    </div>
  </header>
  <main class="lab-shell">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow"><span aria-hidden="true">◈</span> <span id="hero-kicker">太空與衛星 · 數值實驗</span></p>
        <h1 id="lab-title">太空任務試算室</h1>
        <p id="lab-intro">選擇一種任務模型，調整輸入並檢查物理結果。可記錄每次條件，將變更及推論帶回逐步課程。</p>
        <div id="translation-wrap" class="translation" hidden data-no-translate>
          <span id="translation-note" role="status"></span>
          <button id="enable-cloud" type="button" hidden>Enable cloud translation</button>
        </div>
      </div>
      <svg class="hero-diagram" viewBox="0 0 340 220" aria-hidden="true" focusable="false">
        <defs><radialGradient id="earth-tone"><stop stop-color="#45b0af"/><stop offset="1" stop-color="#153c65"/></radialGradient></defs>
        <g fill="none" stroke="#7dabc7" stroke-opacity=".6">
          <ellipse cx="173" cy="107" rx="111" ry="43" transform="rotate(-30 173 107)"/>
          <ellipse cx="173" cy="107" rx="136" ry="61" transform="rotate(-30 173 107)" stroke-dasharray="3 6"/>
          <path d="M47 182h40m-20-20v40M276 51h26m-13-13v26M62 54h16m-8-8v16"/>
        </g>
        <circle cx="173" cy="107" r="50" fill="url(#earth-tone)" stroke="#83cbc8" stroke-width="1.2"/>
        <g fill="none" stroke="#a1e1db" stroke-opacity=".45"><ellipse cx="173" cy="107" rx="25" ry="50"/><ellipse cx="173" cy="107" rx="50" ry="22"/><path d="M123 107h100M173 57v100"/></g>
        <g transform="translate(264 74) rotate(-28)" stroke="#ceedea" stroke-width="1.2">
          <rect x="-9" y="-7" width="18" height="14" rx="2" fill="#ffc36d"/>
          <path d="M-10 0h-7m27 0h7M-29-5v10m58-10v10"/>
          <path d="M-39-5h22v10h-22zm56 0h22v10H17z" fill="#365c83"/>
        </g>
      </svg>
    </section>

    <section class="model-navigation" aria-labelledby="models-heading">
      <h2 id="models-heading">選擇任務模型</h2>
      <div id="models" class="model-list"></div>
    </section>

    <section class="workbench" aria-labelledby="model-title">
      <div class="model-header">
        <div>
          <p id="model-group" class="eyebrow"></p>
          <h2 id="model-title"></h2>
        </div>
        <span id="model-number" class="serial" data-no-translate></span>
      </div>
      <p id="model-prompt" class="prompt"></p>
      <div class="bench-grid">
        <section class="inputs" aria-labelledby="input-heading">
          <h3 id="input-heading">輸入參數</h3>
          <div id="controls"></div>
          <button type="button" id="reset">恢復初始值</button>
        </section>
        <section class="readout" aria-labelledby="result-heading">
          <h3 id="result-heading">即時計算結果</h3>
          <div id="input-error" class="error" role="status" hidden data-no-translate></div>
          <dl id="results" class="results"></dl>
          <figure id="curve" class="curve" hidden>
            <figcaption id="curve-caption"></figcaption>
            <svg id="curve-plot" viewBox="0 0 360 88" aria-hidden="true" focusable="false" data-no-translate></svg>
            <div class="curve-scale" data-no-translate><span id="curve-low"></span><span id="curve-high"></span></div>
            <p id="curve-note" data-no-translate></p>
          </figure>
          <div class="technical">
            <h4 id="formula-heading">計算式</h4>
            <code id="formula" dir="ltr" data-no-translate></code>
            <h4 id="assumption-heading">假設與限制</h4>
            <p id="assumption"></p>
            <h4 id="references-heading">模型參考資料</h4>
            <ul id="references" data-no-translate></ul>
          </div>
          <button type="button" id="record" class="primary">記錄本次試算</button>
        </section>
      </div>
    </section>

    <section class="records" aria-labelledby="records-title">
      <div class="records-heading">
        <div><h2 id="records-title">試算紀錄</h2><p id="records-note"></p></div>
        <button type="button" id="export">匯出 JSON</button>
      </div>
      <div id="record-list" class="record-list" data-no-translate></div>
      <p id="record-status" role="status" data-no-translate></p>
    </section>
    <noscript>請啟用 JavaScript 執行試算。 / Enable JavaScript to run the lab.</noscript>
  </main>
  <script src="runtime-mode.js"></script>
  <script src="config.js"></script>
  <script src="campaign-utils.bundle.js"></script>
  <script src="space-lab-v23-models.js"></script>
  <script src="space-lab-v23.js"></script>
</body>
</html>
